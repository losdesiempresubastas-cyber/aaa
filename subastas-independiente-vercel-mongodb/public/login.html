<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CA Independiente Subastas - Ingresar</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      color: #222
    }

    .caja {
      background: #fff;
      width: min(420px, calc(100% - 32px));
      margin: 60px auto;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 4px 18px #0001
    }

    .caja h1 {
      color: #c8040a;
      font-size: 24px;
      text-align: center
    }

    .pestanas {
      display: flex;
      gap: 8px
    }

    .pestanas button,
    .caja form button {
      flex: 1;
      padding: 11px;
      margin-top: 10px;
      background: #c8040a;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer
    }

    .caja input {
      width: 100%;
      padding: 11px;
      margin-top: 12px;
      border: 1px solid #bbb;
      border-radius: 5px
    }

    .caja form button {
      width: 100%
    }

    #mensaje {
      text-align: center;
      margin-top: 14px;
      line-height: 1.4
    }

    .volver {
      display: block;
      text-align: center;
      color: #c8040a;
      margin-top: 18px
    }
  </style>
</head>

<body>
  <main class="caja">
    <h1>Independiente Subastas</h1>
    <div class="pestanas">
      <button type="button" id="btnLogin">Iniciar sesión</button>
      <button type="button" id="btnRegistro">Crear cuenta</button>
    </div>
    <form id="formLogin">
      <label for="loginMail">Email</label>
      <input type="email" id="loginMail" autocomplete="email" required maxlength="254">
      <label for="loginClave">Contraseña</label>
      <input type="password" id="loginClave" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <form id="formRegistro" hidden>
      <label for="regNombre">Nombre</label>
      <input type="text" id="regNombre" autocomplete="given-name" required maxlength="80">
      <label for="regApellido">Apellido</label>
      <input type="text" id="regApellido" autocomplete="family-name" required maxlength="80">
      <label for="regFecha">Fecha de nacimiento</label>
      <input type="date" id="regFecha" autocomplete="bday" required>
      <label for="regMail">Email</label>
      <input type="email" id="regMail" autocomplete="email" required maxlength="254">
      <label for="regDireccion">Dirección (opcional)</label>
      <input type="text" id="regDireccion" autocomplete="street-address" maxlength="250">
      <label for="regClave">Contraseña</label>
      <input type="password" id="regClave" autocomplete="new-password" required maxlength="72">
      <button type="submit">Registrarme</button>
    </form>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <a class="volver" href="prueba1.html">Volver al inicio</a>
  </main>
  <script>
    const formLogin = document.getElementById('formLogin');
    const formRegistro = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensaje');
    function cambiarFormulario(tipo) {
      formLogin.hidden = tipo !== 'login';
      formRegistro.hidden = tipo !== 'registro';
      mensaje.textContent = '';
    }
    document.getElementById('btnLogin').addEventListener('click', () => cambiarFormulario('login'));
    document.getElementById('btnRegistro').addEventListener('click', () => cambiarFormulario('registro'));
    async function enviar(url, datos) {
      const respuesta = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(datos) });
      const resultado = await respuesta.json().catch(() => ({}));
      if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo completar la operación.');
      return resultado;
    }
    formLogin.addEventListener('submit', async (evento) => {
      evento.preventDefault(); mensaje.textContent = 'Ingresando…';
      const mail = document.getElementById('loginMail').value;
      const clave = document.getElementById('loginClave').value;
      try {
        await enviar('/api/auth/login', { mail, clave });
        window.location.href = 'Perfil.html';
      } catch (error) {
        // Fallback para pruebas escolares offline
        if (error.message.includes('Failed to fetch') || error.message.includes('MONGODB_URI')) {
          localStorage.setItem('cai_usuario', JSON.stringify({
            nombre: 'Usuario',
            apellido: 'Independiente',
            fecha_nacimiento: '2008-01-01',
            mail: mail,
            direccion: 'Av. Mitre 470, Avellaneda'
          }));
          window.location.href = 'Perfil.html';
          return;
        }
        mensaje.textContent = error.message;
      }
    });
    formRegistro.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const clave = document.getElementById('regClave').value;
      mensaje.textContent = 'Creando cuenta…';
      const nombre = document.getElementById('regNombre').value;
      const apellido = document.getElementById('regApellido').value;
      const fecha_nacimiento = document.getElementById('regFecha').value;
      const mail = document.getElementById('regMail').value;
      const direccion = document.getElementById('regDireccion').value;
      try {
        await enviar('/api/auth/registro', {
          nombre,
          apellido,
          fecha_nacimiento,
          mail,
          direccion,
          clave
        });
        window.location.href = 'Perfil.html';
      } catch (error) {
        // Fallback para pruebas escolares offline
        if (error.message.includes('Failed to fetch') || error.message.includes('MONGODB_URI')) {
          localStorage.setItem('cai_usuario', JSON.stringify({
            nombre,
            apellido,
            fecha_nacimiento,
            mail,
            direccion: direccion || 'Av. Mitre 470, Avellaneda'
          }));
          window.location.href = 'Perfil.html';
          return;
        }
        mensaje.textContent = error.message;
      }
    });
  </script>
</body>

</html>
